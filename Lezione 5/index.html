<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini YouTube</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="side-item">
        <ion-icon name="home-outline"></ion-icon>
        <p>Home</p>
    </div>
    <div class="side-item">
        <ion-icon name="compass-outline"></ion-icon>
        <p>Explore</p>
    </div>
    <div class="side-item">
        <ion-icon name="albums-outline"></ion-icon>
        <p>Library</p>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

        <div class="logo">
            <img src="assets/yt-logo.svg" alt="YouTube Logo">
        </div>

        <div class="search">
            <input type="text" placeholder="Search on YouTube">
            <button>
                <ion-icon name="search-outline"></ion-icon>
            </button>
            <ion-icon class="mic" name="mic-outline"></ion-icon>
        </div>

        <div class="top-icons">
            <ion-icon name="videocam-outline"></ion-icon>
            <ion-icon name="notifications-outline"></ion-icon>
            <ion-icon name="person-circle-outline"></ion-icon>
        </div>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- 6 VIDEO CARD -->

        <!-- CARD 1 -->
        <div class="video-card">
            <div class="thumbnail">
                <img src="assets/epicode_thumb.png" alt="Video">
            </div>
            <div class="video-info">
                <div class="channel-icon">
                    <img src="assets/epicode-logo.png" alt="Channel">
                </div>
                <div>
                    <h4>Come diventare sviluppatore</h4>
                    <p>Epicode • 120K views</p>
                </div>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="video-card">
            <div class="thumbnail">
                <img src="assets/epicode_thumb.png" alt="Video">
            </div>
            <div class="video-info">
                <div class="channel-icon">
                    <img src="assets/epicode-logo.png" alt="Channel">
                </div>
                <div>
                    <h4>HTML & CSS Base</h4>
                    <p>Epicode • 80K views</p>
                </div>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="video-card">
            <div class="thumbnail">
                <img src="assets/epicode_thumb.png" alt="Video">
            </div>
            <div class="video-info">
                <div class="channel-icon">
                    <img src="assets/epicode-logo.png" alt="Channel">
                </div>
                <div>
                    <h4>JavaScript per principianti</h4>
                    <p>Epicode • 60K views</p>
                </div>
            </div>
        </div>

        <!-- CARD 4 -->
        <div class="video-card">
            <div class="thumbnail">
                <img src="assets/epicode_thumb.png" alt="Video">
            </div>
            <div class="video-info">
                <div class="channel-icon">
                    <img src="assets/epicode-logo.png" alt="Channel">
                </div>
                <div>
                    <h4>Flexbox spiegato semplice</h4>
                    <p>Epicode • 45K views</p>
                </div>
            </div>
        </div>

        <!-- CARD 5 -->
        <div class="video-card">
            <div class="thumbnail">
                <img src="assets/epicode_thumb.png" alt="Video">
            </div>
            <div class="video-info">
                <div class="channel-icon">
                    <img src="assets/epicode-logo.png" alt="Channel">
                </div>
                <div>
                    <h4>CSS Grid completa</h4>
                    <p>Epicode • 30K views</p>
                </div>
            </div>
        </div>

        <!-- CARD 6 -->
        <div class="video-card">
            <div class="thumbnail">
                <img src="assets/epicode_thumb.png" alt="Video">
            </div>
            <div class="video-info">
                <div class="channel-icon">
                    <img src="assets/epicode-logo.png" alt="Channel">
                </div>
                <div>
                    <h4>Git e GitHub Base</h4>
                    <p>Epicode • 20K views</p>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Ionicons -->
<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
