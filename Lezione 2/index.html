<!DOCTYPE html>
<html lang="it">
<head>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Montserrat:ital,wght@0,400;1,600&display=swap" rel="stylesheet">

    <style>

        /* RESET */
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        /* SEZIONE PRINCIPALE */
        .main-section {
            padding: 20px;
        }

        /* HERO IMAGE */
        .image-container {
            height: 500px;
            background-image: url('https://www.romaguida.com/wp-content/uploads/2024/06/Colosseo-Arena-Foro-4-scaled.jpg');
            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* TITOLO CENTRALE */
        .image-container h1 {
            font-family: 'Prata', serif;
            font-size: 64px;
            font-weight: 400;
            color: white;
            margin: 0;
            text-shadow: 2px 2px 8px rgba(174, 10, 10, 0.6);
        }

        /* SOTTOTITOLO */
        h3 {
            font-family: 'Prata', serif;
            font-size: 24px;
            font-weight: 400;
            margin-top: 10px;
            margin-bottom: 0;
        }

        /* LINK AUTORE */
        a.autore {
            font-weight: 600;
            font-style: italic;
            text-decoration: none;
            color: #a85d2c;
        }

        /* TITOLO LUOGHI CORRELATI */
        h6 {
            padding: 22px;
            margin-top: 56px;
            margin-bottom: 0;
            color: white;
            border-radius: 6px;
            background: linear-gradient(to right, #a85d2c, #d8a35d);
            font-size: 14px;
        }

        /* LISTA */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul li {
            padding: 6px 0 6px 22px;
            border-bottom: 1px solid #dfdfdf;
        }

        ul li a {
            text-decoration: none;
            color: black;
        }

        ul li a:visited {
            color: #a85d2c;
        }

        /* FOOTER */
        footer {
            background-color: black;
            color: white;
            padding: 16px;
            text-align: center;
        }

        footer a {
            color: white;
            text-decoration: none;
        }

    </style>
</head>

<body>

<div class="main-section">

    <div class="image-container">
        <h1>Colosseo</h1>
    </div>

    <h3>Roma, Lazio</h3>

    <p>
        Autore:
